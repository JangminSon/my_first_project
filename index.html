<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>손장민 ❤️ 강명진 결혼합니다</title>
<!-- 카카오톡/문자 링크 미리보기: 배포 후 아래 og:image, og:url을 실제 주소로 바꿔주세요 -->
<meta property="og:type" content="website">
<meta property="og:title" content="손장민 ❤️ 강명진 결혼합니다">
<meta property="og:description" content="2027년 1월 3일 일요일 오후 2시 소중한 분들을 초대합니다">
<meta property="og:image" content="https://jangminson.github.io/my_first_project/intro_3.jpg">
<meta property="og:url" content="https://jangminson.github.io/my_first_project/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F9; --ink:#1F2B3B; --muted:#6B7886; --line:#D5DDE4;
  --blue:#7D9BB0; --blush:#E9D8D4; --white:#fff;
  --serif:'Gowun Batang','Nanum Myeongjo',serif; --sans:'Noto Sans KR',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#E4E9ED;color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.85;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;background:var(--paper);box-shadow:0 0 40px rgba(31,43,59,.08)}
section{padding:72px 28px;text-align:center}
h2{font-family:var(--serif);font-weight:400;font-size:1.05rem;letter-spacing:.18em;color:var(--blue);margin-bottom:28px}
p{font-size:.95rem}
.serif{font-family:var(--serif)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* 사진 자리: 사진이 없으면 그라데이션이 보입니다 */
.ph{background:linear-gradient(160deg,var(--blush),#C9D6DF);position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* 표지 */
.cover{padding:0;height:100svh;min-height:560px;max-height:860px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--white);position:relative}
.cover .ph{position:absolute;inset:0}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,30,45,.72),rgba(20,30,45,0) 55%)}
.cover-text{position:relative;z-index:1;padding:0 28px 56px;animation:rise 1.4s ease both}
.cover .date-v{position:absolute;z-index:1;top:44px;right:26px;writing-mode:vertical-rl;font-family:var(--serif);font-size:.95rem;letter-spacing:.35em;opacity:.92}
.cover h1{font-family:var(--serif);font-weight:400;font-size:2.6rem;line-height:1.35;letter-spacing:.06em}
.cover h1 span{display:block;font-size:1rem;letter-spacing:.3em;opacity:.8;margin:2px 0}
.cover p{margin-top:1px;font-size:.88rem;opacity:.9;letter-spacing:.06em}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 인사말 */
.greeting p{font-family:var(--serif);font-size:1rem;line-height:2.2;color:var(--ink)}
.parents{margin-top:36px;font-size:.92rem;color:var(--muted);line-height:2}
.parents b{font-family:var(--serif);font-weight:700;color:var(--ink);margin-left:6px}

/* 일시 + 달력 */
.when{background:var(--white)}
.when .big{font-family:var(--serif);font-size:1.35rem;line-height:1.7;margin-bottom:6px}
.when .sub{color:var(--muted);font-size:.9rem}
.cal{margin:32px auto 0;max-width:320px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;font-size:.85rem}
.cal .dow{color:var(--muted);font-size:.75rem;padding-bottom:6px}
.cal .sun{color:#C0766E}
.cal .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal .on{background:var(--ink);color:var(--white);font-weight:500}
.dday{margin-top:28px;font-family:var(--serif);color:var(--blue);font-size:1rem}

/* 장소 */
.venue .name{font-family:var(--serif);font-size:1.25rem;margin-bottom:2px}
.venue .addr{color:var(--muted);font-size:.9rem;white-space:pre-line}

/* 간략 지도 스타일 */
.map-wrap{margin-top:22px;width:100%;height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--white)}
.map-wrap iframe{width:100%;height:100%;border:0}
.map-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.btn{font:inherit;font-size:.85rem;font-weight:400;padding:10px 18px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{background:var(--line)}
.howto{margin-top:30px;text-align:left;font-size:.88rem;color:var(--muted)}
.howto dt{font-weight:500;color:var(--ink);margin-top:14px;font-size:.92rem}
.howto dd{margin-top:4px;line-height:1.6}

/* 갤러리 */
.gallery{background:var(--white);padding-left:12px;padding-right:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .ph{aspect-ratio:3/4;cursor:pointer;border:0;padding:0;display:block;width:100%}
.grid .ph:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.lb{position:fixed;inset:0;background:rgba(15,22,32,.94);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:max(16px,env(safe-area-inset-top));right:18px;background:none;border:0;color:#fff;font-size:2rem;line-height:1;cursor:pointer}

/* 마음 전하실 곳 */
details{background:var(--white);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;text-align:left}
summary{padding:16px 20px;cursor:pointer;font-family:var(--serif);font-size:1rem;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue)}
details[open] summary::after{content:"−"}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--line);font-size:.88rem}
.acct small{display:block;color:var(--muted);font-size:.8rem}
.acct .btn{padding:7px 14px;flex:none}

/* 맺음 */
.end{background:var(--ink);color:#C8D2DB;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.end .serif{color:var(--white);font-size:1.1rem;margin-bottom:20px}
.end .btn{background:transparent;color:var(--white);border-color:#4B5A6B}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.cover-text{animation:none}html{scroll-behavior:auto}.toast{transition:none}}
</style>
</head>
<body>
<main>

<section class="cover">
  <div class="ph" id="coverPh"></div>
  <div class="date-v" id="coverDate"></div>
  <div class="cover-text">
    <h1 id="coverNames"></h1>
    <p id="coverInfo"></p>
    <p id="coverInfo2"></p>
  </div>
</section>

<section class="greeting">
  <h2>초대합니다</h2>
  <p id="greetText"></p>
  <div class="parents" id="parents"></div>
</section>

<section class="when">
  <h2>일시</h2>
  <p class="big" id="whenBig"></p>
  <div class="cal" id="cal" aria-label="결혼식 달력"></div>
  <p class="dday" id="dday"></p>
</section>

<section class="venue">
  <h2>오시는 길</h2>
  <p class="name" id="vName"></p>
  <p class="addr" id="vAddr"></p>

  <!-- 🗺️ 간략 지도 영역 (네이버 지도 퍼가기 iframe 코드 삽입 위치) -->
  <div class="map-wrap">
    <img src="map.png" alt="아펠가모 반포 오시는 길 지도">
  </div>

  <div class="btns">
    <a class="btn" id="mapNaver" target="_blank" rel="noopener">네이버 지도</a>
    <a class="btn" id="mapKakao" target="_blank" rel="noopener">카카오맵</a>
    <button class="btn" id="copyAddr" type="button">주소 복사</button>
  </div>
  <dl class="howto" id="howto"></dl>
</section>

<section class="gallery">
  <h2>갤러리</h2>
  <div class="grid" id="grid"></div>
</section>

<section>
  <h2>마음 전하실 곳</h2>
  <p style="margin-bottom:24px;color:var(--muted)">참석이 어려워 마음만 전하시는 분들을 위해<br>계좌번호를 안내드립니다.</p>
  <div id="accounts"></div>
</section>

<section class="end">
  <p class="serif" id="endText"></p>
  <div class="btns">
    <button class="btn" id="shareBtn" type="button">청첩장 링크 공유</button>
  </div>
</section>

</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button type="button" id="lbClose" aria-label="닫기">×</button>
  <img id="lbImg" alt="">
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   ✏️ 설정 영역
   ============================================================ */
const CONFIG = {
  groom: { name: '손장민', father: '손정수', mother: '우미향', order: '장남' },
  bride: { name: '강명진', father: '강영현', mother: '조영옥', order: '장녀' },
  date: '2027-01-03T14:00:00+09:00',
  venue: {
    name: '아펠가모 반포',
    address: '서울특별시 서초구 반포대로 235 (반포동)\n반포 효성빌딩 LL층',
    howto: [
      ['지하철 안내', '고속터미널역(3호선, 7호선, 9호선) 5번 출구(7호선) 방향으로 나와, 서래골공원 방면 신호등 건넌 후 첫 번째 건물 (반포 효성빌딩) LL층'],
      ['버스 안내', '• 간선: 405, 740<br>• 지선: 5413<br>• 공항버스: 6703<br>(※ 서울지방조달청역 하차, 반포 효성빌딩 LL층)'],
      ['주차 안내', '건물 내 지하주차장 2시간 무료']
    ]
  },
  greeting: '혼자일 때보다 둘일 때 더 나다워지는 사람,\n그 사람과 평생 함께 걷기로 했습니다.\n\n저희가 걸어갈 길에\n따뜻한 축복 한 말씀 보태 주시면\n오래도록 마음에 새기겠습니다.',
  closing: '함께해 주셔서 감사합니다',
  cover: 'intro_3.jpg',
  photos: ['bridal_carry_bw.jpg','0103_bed.jpg','marching.jpg','outside_veil.jpg','sofa_confetti.jpg','standing_bw.jpg'],
  accounts: {
    '신랑측': [
      { who: '신랑 손장민', bank: '국민', no: '596002-04-050834' },
      { who: '아버지 손정수', bank: '농협', no: '807061-56-098461' },
      { who: '어머니 우미향', bank: '국민', no: '642001-04-380646' }
    ],
    '신부측': [
      { who: '신부 강명진', bank: '국민', no: '596002-04-050834' },
      { who: '아버지 강영현', bank: '국민', no: '010-21-0585-524' },
      { who: '어머니 조영옥', bank: '국민', no: '010-24-0408-812' }
    ]
  }
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const d = new Date(CONFIG.date);
const DOW = ['일','월','화','수','목','금','토'];
const hr = d.getHours(), min = d.getMinutes();
const timeStr = `${hr < 12 ? '오전' : '오후'} ${hr % 12 || 12}시${min ? ' ' + min + '분' : ''}`;
const dateStr = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;

document.title = `${CONFIG.groom.name} ❤️ ${CONFIG.bride.name} 결혼합니다`;

function photo(el, src, alt){
  const img = new Image();
  img.alt = alt || '';
  img.onload = () => { el.appendChild(img); el.dataset.ok = '1'; };
  img.src = src;
}

photo($('coverPh'), CONFIG.cover, `${CONFIG.groom.name}, ${CONFIG.bride.name}`);
$('coverDate').textContent = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}`;
$('coverNames').innerHTML = `${CONFIG.groom.name}<span>그리고</span>${CONFIG.bride.name}`;
$('coverInfo').textContent = `${dateStr} ${timeStr}`;
$('coverInfo2').textContent = `${CONFIG.venue.name}`;

$('greetText').innerHTML = CONFIG.greeting.replace(/\n/g, '<br>');
const g = CONFIG.groom, b = CONFIG.bride;
$('parents').innerHTML =
  `<b>${g.father} · ${g.mother}</b> 의 ${g.order}<b>${g.name}</b><br><b>${b.father} · ${b.mother}</b> 의 ${b.order}<b>${b.name}</b>`;

$('whenBig').innerHTML = `${dateStr}<br>${timeStr}`;
(function cal(){
  const y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
  let h = DOW.map((w, i) => `<div class="dow ${i === 0 ? 'sun' : ''}">${w}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div></div>';
  for (let n = 1; n <= last; n++){
    const sun = (first + n - 1) % 7 === 0;
    h += `<div class="day ${n === d.getDate() ? 'on' : ''} ${sun ? 'sun' : ''}">${n}</div>`;
  }
  $('cal').innerHTML = h;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(y, m, d.getDate());
  const diff = Math.round((target - today) / 86400000);
  $('dday').textContent = diff > 0 ? `결혼식까지 ${diff}일 남았습니다` : diff === 0 ? '오늘 결혼합니다' : '';
})();

$('vName').textContent = CONFIG.venue.name;
$('vAddr').textContent = CONFIG.venue.address;
const q = encodeURIComponent(CONFIG.venue.address);
$('mapNaver').href = `https://map.naver.com/p/search/${q}`;
$('mapKakao').href = `https://map.kakao.com/?q=${q}`;
$('howto').innerHTML = CONFIG.venue.howto.map(([t, s]) => `<dt>${t}</dt><dd>${s}</dd>`).join('');
$('howto').hidden = !CONFIG.venue.howto.length;

$('grid').innerHTML = CONFIG.photos.map(() => '<button class="ph" type="button" aria-label="사진 크게 보기"></button>').join('');
[...$('grid').children].forEach((el, i) => {
  photo(el, CONFIG.photos[i], `웨딩 사진 ${i + 1}`);
  el.onclick = () => {
    if (!el.dataset.ok) return;
    $('lbImg').src = CONFIG.photos[i];$('lb').classList.add('open');
  };
});
$('lb').onclick = () =>$('lb').classList.remove('open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('lb').classList.remove('open'); });

$('accounts').innerHTML = Object.entries(CONFIG.accounts).map(([side, list]) =>
  `<details><summary>${side}</summary>${list.map(a =>
    `<div class="acct"><div>${a.bank} ${a.no}<small>${a.who}</small></div>
     <button class="btn" type="button" data-copy="${a.bank}${a.no}">복사</button></div>`).join('')}</details>`
).join('');

$('endText').textContent = CONFIG.closing;

const toast = msg => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
};
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('복사되었습니다');
}
$('copyAddr').onclick = () => copy(CONFIG.venue.address);
$('accounts').addEventListener('click', e => {   const t = e.target.closest('[data-copy]'); if (t) copy(t.dataset.copy); });$('shareBtn').onclick = async () => {
  const data = { title: document.title, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch {} }
  else copy(location.href);
};
</script>
<script src="swipe.js?v=1"></script>
</body>
</html>
